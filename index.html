<html>
	<head>
		<title>My Login page</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="container">
			<div class="login-box">
						<!-- Login Form -->
						<div id="login-form">
							<h2>Login</h2>
							<form id="main-login">
								<div class="input-box">
									<input type="email" id="login-email" required>
									<label>Email</label>
								</div>
								<div class="input-box">
									<input type="password" id="login-pass" required>
									<label>Password</label>
								</div>
								<div class="forgot-pass">
									<a href="#" onclick="showForm('forgot-form')">Forget your password?</a>
								</div>
								<button type="submit" class="btn">Login</button>
								<div class="signup-link">
									<a href="#" onclick="showForm('signup-form')">Signup</a>
								</div>
							</form>
						</div>

						<!-- Signup Form (Hidden by default) -->
						<div id="signup-form" style="display:none;">
							<h2>Signup</h2>
							<form id="main-signup">
								<div class="input-box">
									<input type="email" id="reg-email" required>
									<label>Create Email</label>
								</div>
								<div class="input-box">
									<input type="password" id="reg-pass" required>
									<label>Create Password</label>
								</div>
								<button type="submit" class="btn">Register</button>
								<div class="signup-link">
									<a href="#" onclick="showForm('login-form')">Back to Login</a>
								</div>
							</form>
						</div>

						<!-- Forgot Password Form (Hidden by default) -->
						<div id="forgot-form" style="display:none;">
							<h2>Reset</h2>
							<p style="color:white; text-align:center; font-size:0.8em;">Enter email to reset password</p>
							<form id="main-forgot">
								<div class="input-box">
									<input type="email" required>
									<label>Email</label>
								</div>
								<button type="submit" class="btn">Reset Password</button>
								<div class="signup-link">
									<a href="#" onclick="showForm('login-form')">Back to Login</a>
								</div>
							</form>
						</div>
					</div>

			<script>
					// Function to switch between Login, Signup, and Forgot forms
					function showForm(formId) {
						document.getElementById('login-form').style.display = 'none';
						document.getElementById('signup-form').style.display = 'none';
						document.getElementById('forgot-form').style.display = 'none';
						document.getElementById(formId).style.display = 'block';
					}

					// SIGNUP LOGIC: Save data to LocalStorage
					document.getElementById('main-signup').addEventListener('submit', (e) => {
						e.preventDefault();
						const email = document.getElementById('reg-email').value;
						const pass = document.getElementById('reg-pass').value;
						
						localStorage.setItem('userEmail', email);
						localStorage.setItem('userPass', pass);
						
						alert("Registration Successful! Now you can Login.");
						document.getElementById('main-signup').reset();
						showForm('login-form');
					});

					// LOGIN LOGIC: Check against saved data
					document.getElementById('main-login').addEventListener('submit', (e) => {
						e.preventDefault();
						const email = document.getElementById('login-email').value;
						const pass = document.getElementById('login-pass').value;

						const savedEmail = localStorage.getItem('userEmail');
						const savedPass = localStorage.getItem('userPass');

						if (email === savedEmail && pass === savedPass) {
							alert("Login Success! Welcome back.");
							document.getElementById('main-login').reset();
						} else {
							alert("Invalid Email or Password! Did you Signup first?");
						}
					});

					// FORGOT PASSWORD LOGIC
					document.getElementById('main-forgot').addEventListener('submit', (e) => {
						e.preventDefault();
						const savedPass = localStorage.getItem('userPass');
						if(savedPass) {
							alert("Your saved password is: " + savedPass);
						} else {
							alert("No account found with this email.");
						}
					});
				</script>

	</body>
</html>
